[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "directional-verification"
dynamic = ["version"]
description = "Distill facts by scoring answers in the direction the teacher knows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jungseob Lee" }]
keywords = ["knowledge-distillation", "reversal-curse", "pseudo-labels", "masked-diffusion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Label selection, the metrics and every table script run on numpy alone.
# Teacher scoring and student training come with the train extra and load on first use.
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
train = ["torch>=2.4", "transformers>=5.0", "peft>=0.17", "accelerate>=1.0"]
test = ["pytest>=8"]

[project.scripts]
ddv = "ddv.cli:main"

[project.urls]
Homepage = "https://github.com/js-lee-AI/directional-verification"
Issues = "https://github.com/js-lee-AI/directional-verification/issues"

[tool.setuptools.dynamic]
version = { attr = "ddv.__version__" }

[tool.setuptools.packages.find]
include = ["ddv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device and the train extra"]
addopts = "-m 'not gpu'"
